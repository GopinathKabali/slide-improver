<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slide Improver</title>
    <link rel="stylesheet" href="taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script defer src="taskpane.js"></script>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">POWERPOINT ASSISTANT</p>
        <h1>Slide Improver</h1>
        <p class="intro">Get practical ideas to make your slides clearer and more polished.</p>
      </header>

      <section class="card" aria-labelledby="review-heading">
        <h2 id="review-heading">Review a slide</h2>
        <label for="request">What would you like help with?</label>
        <textarea id="request" rows="3" placeholder="For example: Make this slide clearer and improve the layout."></textarea>
        <button id="review-button" type="button">Review current slide</button>
        <p id="status" role="status" aria-live="polite">The assistant is ready.</p>
      </section>

      <section id="suggestions" class="card suggestions" aria-live="polite" hidden>
        <h2>Suggestions</h2>
        <p id="suggestion-text"></p>
        <p class="note">AI suggestions and one-click formatting changes will be added in the next step.</p>
      </section>
      <footer>Changes should be reviewed before they are applied.</footer>
    </main>
  </body>
</html>
